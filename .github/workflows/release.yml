name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
      mode:
        description: 'Publish missing versions, or only verify and complete a previous release'
        type: choice
        options: [verify-only, publish]
        default: verify-only

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 50
    steps:
      - name: Resolve tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Invalid stable release tag"; exit 1; }
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "Releasing: ${TAG}"

      # Keep current recovery tooling even when releasing an older tag.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: package
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned npm for OIDC trusted publishing
        run: npm install -g npm@11.21.0

      - name: Verify dist
        working-directory: package
        run: |
          test -f dist/index.js || { echo "dist/index.js not found"; exit 1; }
          echo "dist/index.js: $(wc -c < dist/index.js) bytes"

      - name: Validate release version
        working-directory: package
        run: |
          node --input-type=module -e 'import {validateRelease} from "../release-tools/.github/scripts/release-packages.mjs"; import fs from "node:fs"; validateRelease(process.env.RELEASE_TAG, JSON.parse(fs.readFileSync("package.json", "utf8")));'

      - name: Check publishable package contents
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'publish' }}
        working-directory: package
        run: |
          node ../release-tools/.github/scripts/verify-package-bin.mjs
          npm pack --dry-run

      - name: Publish and verify packages
        working-directory: package
        timeout-minutes: 42
        env:
          RELEASE_MODE: ${{ inputs.mode || 'publish' }}
          RELEASE_REPORT: ${{ runner.temp }}/npm-release-report.json
        run: node ../release-tools/.github/scripts/release-packages.mjs "$RELEASE_TAG" "$RELEASE_MODE"

      - name: Extract release notes from CHANGELOG
        id: changelog
        working-directory: package
        run: |
          VERSION="${RELEASE_VERSION}"
          NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{/^## \[${VERSION}\]/d;/^## \[/d;p}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release v${VERSION}"
          fi
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: /tmp/release-notes.md
